  <ellipse cx="733.0" cy="112.0" rx="27.0" ry="86.0" fill="url(#gPlate)" stroke="url(#gEdge)" stroke-width="2.6"/><ellipse cx="733.0" cy="103.4" rx="14.0" ry="42.0" fill="url(#gPlateIn)"/><ellipse cx="727.6" cy="81.0" rx="8.1" ry="18.9" fill="url(#gSpec)"/>
  <ellipse cx="241.0" cy="112.0" rx="23.0" ry="70.0" fill="url(#gPlate)" stroke="url(#gEdge)" stroke-width="2.6"/><ellipse cx="241.0" cy="105.0" rx="12.0" ry="34.2" fill="url(#gPlateIn)"/><ellipse cx="236.4" cy="86.8" rx="6.9" ry="15.4" fill="url(#gSpec)"/>
  <ellipse cx="759.0" cy="112.0" rx="23.0" ry="70.0" fill="url(#gPlate)" stroke="url(#gEdge)" stroke-width="2.6"/><ellipse cx="759.0" cy="105.0" rx="12.0" ry="34.2" fill="url(#gPlateIn)"/><ellipse cx="754.4" cy="86.8" rx="6.9" ry="15.4" fill="url(#gSpec)"/>

