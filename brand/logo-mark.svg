<path d="M500 150 C504.48 173.52 504.48 173.52 528 178 C504.48 182.48 504.48 182.48 500 206 C495.52 182.48 495.52 182.48 472 178 C495.52 173.52 495.52 173.52 500 150 Z" fill="url(#gSpark)" opacity="1.0"/>
